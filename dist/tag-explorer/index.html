<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Explorer | Unit Navigator</title>
<link rel="stylesheet" href="../demethanizer/fonts.css">
<link rel="stylesheet" href="tag-explorer.css">
<link rel="stylesheet" href="demo.css">
<script src="../assets/embed-appearance.js"></script>
<script src="../analytics-figures/plotly.min.js" defer></script>
<script src="replay-data.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main>
  <header class="page-header">
    <div><p class="brand">UNIT NAVIGATOR</p><h1>Tag Explorer</h1><p class="subtitle">HYSYS Deethanizer · FIC-100 feed-flow setpoint step</p></div>
    <span class="replay-label">Simulation replay</span>
  </header>
  <div class="workspace-name">
    <label for="workspaceName">Workspace name</label>
    <input id="workspaceName" type="text" value="Demethanizer-demo" readonly>
  </div>
  <div class="explorer-workspace">
    <section class="signal-browser" aria-labelledby="tags-title">
      <div class="signal-browser-heading"><h2 id="tags-title">Select variables</h2><output id="variableCount" aria-label="Selected variables"></output></div>
      <input id="signalSearch" type="search" aria-label="Search available process tags" placeholder="Search tags">
      <div class="signal-list" id="signalList"></div>
      <p id="noTags" hidden>No matching tags.</p>
    </section>
    <section class="explorer-trends" aria-labelledby="trends-title">
      <div class="explorer-toolbar">
        <div>
          <h2 id="trends-title">Trends</h2>
          <div class="trend-detail">
            <select id="trendLane" aria-label="Trend to display" disabled>
              <option value="flow">Feed flow control</option>
              <option value="output">Controller output</option>
              <option value="duty">Reboiler duty</option>
              <option value="product">Product flow</option>
            </select>
            <span id="phase"></span>
          </div>
        </div>
        <div class="explorer-tools">
          <button id="toggle" type="button" disabled>Pause</button>
          <button id="restart" type="button" disabled>Restart</button>
          <button id="resetZoom" type="button" disabled>Reset zoom</button>
          <label>Speed <select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="6" selected>6×</option><option value="12">12×</option></select></label>
        </div>
      </div>
      <div class="timeline">
        <label for="cursor">Replay timeline</label>
        <input id="cursor" type="range" min="0" value="0" step="any" disabled>
        <output id="clock" for="cursor">0.0 s</output>
      </div>
      <p id="plotError" role="alert" hidden></p>
      <div id="plotLanes" class="plot-lanes">
        <section class="plot-lane current"><h3>Feed flow control</h3><div id="flow" class="lane-chart" aria-label="Feed flow and setpoint trend"></div></section>
        <section class="plot-lane"><h3>Controller output</h3><div id="output" class="lane-chart" aria-label="Controller output trend"></div></section>
        <section class="plot-lane"><h3>Reboiler duty</h3><div id="duty" class="lane-chart" aria-label="Reboiler duty trend"></div></section>
        <section class="plot-lane"><h3>Product flow</h3><div id="product" class="lane-chart" aria-label="Product flow trends"></div></section>
      </div>
      <noscript>Enable JavaScript to view the replay.</noscript>
    </section>
  </div>
</main>
</body>
</html>
